<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
  <title>3D模型可视化工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 左侧面板 -->
    <div id="left-panel">
      <div id="mode-tabs">
        <button id="tab-position" class="mode-tab active">位置图</button>
        <button id="tab-explosion" class="mode-tab">爆炸图</button>
      </div>

      <!-- 位置图模式面板 -->
      <div id="position-panel" class="mode-panel active">
        <div class="panel-section">
          <div class="section-title">车壳模型</div>
          <button id="btn-load-shell" class="btn">+ 加载车壳</button>
          <select id="shell-selector" class="select" style="display:none">
            <option value="">-- 选择车壳 --</option>
          </select>
          <div id="shell-list" class="tree-list"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">目标部件</div>
          <button id="btn-load-parts" class="btn">+ 加载部件</button>
          <div id="part-tree-position" class="tree-view"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">部件颜色</div>
          <div id="color-picker-container" style="display:none">
            <input type="color" id="part-color-picker" value="#ff4444">
            <span id="selected-part-name"></span>
            <button id="btn-apply-color" class="btn small">应用</button>
          </div>
        </div>
        <div class="panel-section">
          <button id="btn-export-position" class="btn primary">导出位置图 PNG</button>
        </div>
      </div>

      <!-- 爆炸图模式面板 -->
      <div id="explosion-panel" class="mode-panel">
        <div class="panel-section">
          <div class="section-title">目标部件</div>
          <button id="btn-load-parts-explosion" class="btn">+ 加载部件</button>
          <div id="part-tree-explosion" class="tree-view"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">爆炸控制</div>
          <div class="btn-row">
            <button id="btn-auto-explode" class="btn">自动爆炸</button>
            <button id="btn-reset-explosion" class="btn">复位</button>
          </div>
          <div class="slider-group">
            <label>爆炸距离: <span id="explosion-distance-label">1.0</span></label>
            <input type="range" id="explosion-distance" min="0.2" max="3.0" step="0.1" value="1.0">
          </div>
        </div>
        <div class="panel-section">
          <div class="section-title">手动移动</div>
          <div class="btn-row">
            <button id="btn-enter-drag" class="btn">进入拖动模式</button>
            <button id="btn-exit-drag" class="btn" style="display:none">退出拖动模式</button>
          </div>
          <div class="drag-hint" id="drag-hint" style="display:none">
            拖动坐标轴手柄移动部件 | 空格键切换平移/旋转
          </div>
        </div>
        <div class="panel-section">
          <button id="btn-export-explosion" class="btn primary">导出爆炸图 PNG</button>
        </div>
      </div>
    </div>

    <!-- 右侧可视化窗口 -->
    <div id="viewer-container">
      <canvas id="three-canvas"></canvas>
      <canvas id="annotation-canvas"></canvas>
      <div id="status-bar">
        <span id="status-text">就绪</span>
      </div>
    </div>
  </div>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
